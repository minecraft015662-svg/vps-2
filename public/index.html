<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VPanel – Virtualization Control Panel</title>
<style>:root{--sb:#1b2a41;--bg:#eef2f7;--card:#fff;--line:#e1e7ef;--tx:#27324a;--mu:#7a869a;--ac:#2f80ed;--ok:#27ae60;--bad:#eb5757;--warn:#f2994a}
@media(prefers-color-scheme:dark){:root{--bg:#0f1624;--card:#17213a;--line:#26324f;--tx:#e6ebf7;--mu:#8e9bb8}}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
.side{position:fixed;inset:0 auto 0 0;width:220px;background:var(--sb);color:#cfd8e8;padding:0 0 12px;overflow:auto}
.logo{padding:18px;font-size:20px;font-weight:800;color:#fff;border-bottom:1px solid #ffffff18;margin-bottom:8px}.logo span{color:var(--ac)}
.side a{display:block;padding:11px 18px;cursor:pointer;border-left:3px solid transparent}.side a:hover{background:#ffffff0d}.side a.on{background:#ffffff14;border-color:var(--ac);color:#fff}
.top{margin-left:220px;height:52px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px}
main{margin-left:220px;padding:22px}h2{margin:0 0 16px;font-size:20px}h3{margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:14px}.grid .card{margin:0}
.stat{display:flex;align-items:center;gap:12px}.ico{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;font-size:20px;color:#fff}.big{font-size:24px;font-weight:700;line-height:1}.mu{color:var(--mu);font-size:12px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}th{color:var(--mu);font-weight:600;font-size:12px;text-transform:uppercase}
.tag{padding:2px 8px;border-radius:3px;font-size:11px;font-weight:700;background:#2f80ed22;color:var(--ac)}.running,.online{color:var(--ok)}.error,.offline{color:var(--bad)}.stopped{color:var(--warn)}
button{background:var(--ac);color:#fff;border:0;border-radius:4px;padding:7px 12px;cursor:pointer;margin:2px;font-size:13px}button.g{background:#8e9bb833;color:var(--tx)}button.d{background:var(--bad)}button.s{background:var(--ok)}
input,select,textarea{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:4px;padding:9px;width:100%;margin:4px 0 12px}label{font-size:12px;color:var(--mu);font-weight:600}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 16px}
.ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--c,var(--ac)) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;margin:0 auto 6px}.ring i{font-style:normal;width:72px;height:72px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:700}
.rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));text-align:center}
.tabs button{border-radius:4px 4px 0 0}.tabs button.on{background:var(--ac);color:#fff}
pre{background:#0d1424;color:#bcd;padding:12px;border-radius:4px;overflow:auto;max-height:320px;margin:8px 0}.wrap{overflow-x:auto}code{background:#8e9bb822;padding:2px 6px;border-radius:3px}
#login{max-width:340px;margin:12vh auto;padding:24px}
@media(max-width:760px){.side{position:static;width:auto;display:flex;overflow:auto}.logo{display:none}.top,main{margin-left:0}}</style></head><body>
<div id="login" class="card"><div class="logo" style="color:var(--tx);border:0">V<span>Panel</span></div><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button onclick="auth('/login')">Login</button><button class="g" onclick="auth('/register')">Register</button><div id="le" class="error"></div></div>
<div id="app" style="display:none"><div class="side" id="sb"></div><div class="top"><b id="ttl"></b><span><span class="mu" id="who"></span> <button class="g" onclick="logout()">Logout</button></span></div><main id="m"></main></div>
<script>
let T=localStorage.t||'',ROLE='',DEMO=false,PG='dash',CD={};
const DN=[{id:'n1',name:'Local Node',host:'127.0.0.1',types:['docker','lxc','kvm','hvm'],online:true,local:true,vps:3,info:'8 CPU | 16000 MB RAM | docker:yes lxc:yes kvm:yes'},{id:'n2',name:'Mumbai KVM Node',host:'203.0.113.10',types:['kvm','hvm'],online:true,vps:5,info:'16 CPU | 64000 MB RAM | kvm:yes'}];
const DV=[{id:'a1',name:'vps-web01',owner:'demo',node:'n1',type:'kvm',ram:2048,cpu:2,disk:40,os:'ubuntu',ip:'203.0.113.5',sshPort:20001,user:'root',pass:'Xk29aPq1',status:'running'},{id:'a2',name:'vps-game02',owner:'demo',node:'n1',type:'docker',ram:1024,cpu:1,disk:10,os:'debian',ip:'203.0.113.5',sshPort:20002,user:'root',pass:'Lm83zQw2',status:'running'},{id:'a3',name:'vps-lab03',owner:'rahul',node:'n2',type:'hvm',ram:4096,cpu:4,disk:80,os:'ubuntu',ip:'203.0.113.10',sshPort:20003,user:'root',pass:'Qa17ttE9',status:'stopped'}];
const DP=[{id:'p1',name:'Starter',ram:1024,cpu:1,disk:10,bw:1000},{id:'p2',name:'Standard',ram:2048,cpu:2,disk:40,bw:2000},{id:'p3',name:'Pro',ram:4096,cpu:4,disk:80,bw:4000}];
async function api(me,u,b){try{const r=await fetch('/api'+u,{method:me,headers:{'Content-Type':'application/json',Authorization:'Bearer '+T},body:b?JSON.stringify(b):undefined});return await r.json();}catch(e){DEMO=true;
 if(u.startsWith('/nodes'))return DN;if(u.startsWith('/plans'))return DP;if(u==='/users')return[{u:'admin',role:'admin'},{u:'demo',role:'user'},{u:'rahul',role:'user'}];if(u.endsWith('/stats'))return{ok:true,state:'running',cpu:23,ram:41,disk:35};if(u.startsWith('/vps')&&me==='GET')return DV;return{ok:true,out:'total 20\ndrwxr-xr-x 5 root root 4096 etc\ndrwxr-xr-x 2 root root 4096 home\ndrwx------ 3 root root 4096 root\n(demo mode)',token:'demo',role:'admin',user:'demo'};}}
async function auth(p){const r=await api('POST',p,{user:u.value,pass:document.getElementById('p').value});if(r.token){T=r.token;localStorage.t=T;ROLE=r.role;who.textContent=r.user;start();}else le.textContent=r.error||'Failed';}
function logout(){localStorage.t='';location.reload();}
const adm=()=>ROLE==='admin',esc=s=>String(s||'').replace(/</g,'&lt;');
async function start(){login.style.display='none';app.style.display='block';if(!ROLE){const me=await api('GET','/me');if(me.error&&!DEMO)return logout();ROLE=me.role||'admin';who.textContent=me.user||'';}
 const items=adm()?[['dash','📊','Dashboard'],['vps','🖥️','Virtual Servers'],['create','➕','Create VPS'],['plans','📦','Plans'],['nodes','🌐','Nodes'],['users','👥','Users']]:[['vps','🖥️','My VPS']];
 sb.innerHTML='<div class="logo">V<span>Panel</span></div>'+items.map(i=>`<a id="n-${i[0]}" onclick="go('${i[0]}')">${i[1]} ${i[2]}</a>`).join('');go(adm()?'dash':'vps');}
function go(p,arg){PG=p;document.querySelectorAll('.side a').forEach(a=>a.classList.remove('on'));const e=document.getElementById('n-'+p);if(e)e.classList.add('on');ttl.textContent=p==='detail'?'VPS Details':(e?e.textContent:'');({dash,vps,create:createPg,plans,nodes,users,detail})[p](arg);}
const stat=(i,c,n,l)=>`<div class="card stat"><div class="ico" style="background:${c}">${i}</div><div><div class="big">${n}</div><div class="mu">${l}</div></div></div>`;
async function dash(){const[V,N]=await Promise.all([api('GET','/vps'),api('GET','/nodes')]);const run=V.filter(v=>v.status==='running').length;
 m.innerHTML=`<h2>Dashboard</h2><div class="grid">${stat('🖥️','#2f80ed',V.length,'Total VPS')}${stat('▶','#27ae60',run,'Running')}${stat('⏸','#f2994a',V.length-run,'Stopped / Error')}${stat('🌐','#9b51e0',N.length,'Nodes')}</div><div class="card"><h3>Nodes</h3><div class="wrap"><table><tr><th>Name</th><th>Host</th><th>Supports</th><th>Status</th><th>VPS</th><th>Info</th></tr>${N.map(n=>`<tr><td><b>${n.name}</b></td><td>${n.host||''}</td><td>${n.types.map(t=>`<span class="tag">${t.toUpperCase()}</span> `).join('')}</td><td class="${n.online?'online':'offline'}">● ${n.online?'Online':'Offline'}</td><td>${n.vps}</td><td class="mu">${esc(n.info)}</td></tr>`).join('')}</table></div></div>`;}
async function vps(){const V=await api('GET','/vps');m.innerHTML=`<h2>${adm()?'Virtual Servers':'My VPS'}</h2><div class="card wrap"><table><tr><th>Hostname</th><th>Type</th><th>Plan</th><th>IP : SSH port</th>${adm()?'<th>Owner</th>':''}<th>Status</th><th></th></tr>${V.map(v=>`<tr><td><b>${v.name}</b><div class="mu">${v.os}</div></td><td><span class="tag">${v.type.toUpperCase()}</span></td><td>${v.cpu} vCPU · ${v.ram} MB · ${v.disk} GB</td><td><code>${v.ip}:${v.sshPort}</code></td>${adm()?`<td>${v.owner}</td>`:''}<td class="${v.status}">● ${v.status}</td><td><button onclick='go("detail","${v.id}")'>Manage</button></td></tr>`).join('')||'<tr><td colspan=7 class=mu>No VPS yet</td></tr>'}</table></div>`;}
const ring=(l,v,c)=>`<div><div class="ring" style="--p:${v||0};--c:${c}"><i>${v==null?'N/A':v+'%'}</i></div><div class="mu">${l}</div></div>`;
async function detail(id,tab='ov'){const V=await api('GET','/vps');const v=V.find(x=>x.id===id);if(!v)return vps();CD=v;const s=await api('GET','/vps/'+id+'/stats');
 const tb=(k,l)=>`<button class="${tab===k?'on':'g'}" onclick='detail("${id}","${k}")'>${l}</button>`;let body='';
 if(tab==='ov')body=`<div class="card"><div class="rings">${ring('CPU',s.cpu,'#2f80ed')}${ring('RAM',s.ram,'#27ae60')}${ring('Disk',s.disk,'#f2994a')}</div>${s.cpu==null?'<div class="mu" style="text-align:center">Live usage is available for Docker/LXC. KVM/HVM show power state only.</div>':''}</div><div class="card"><h3>Connection</h3><table><tr><td class="mu">SSH command</td><td><code>ssh ${v.user}@${v.ip} -p ${v.sshPort}</code></td></tr><tr><td class="mu">Username</td><td>${v.user}</td></tr><tr><td class="mu">Password</td><td><code>${esc(v.pass)}</code></td></tr><tr><td class="mu">Virtualization</td><td>${v.type.toUpperCase()}</td></tr><tr><td class="mu">Resources</td><td>${v.cpu} vCPU · ${v.ram} MB RAM · ${v.disk} GB disk</td></tr></table></div>`;
 if(tab==='fm')body=`<div class="card"><h3>File Manager</h3><input id="fp" value="/"><button onclick="fl('${id}')">List</button><button class="g" onclick="fo('${id}')">Open file</button><pre id="fout">Click List to browse. ${v.type==='kvm'||v.type==='hvm'?'KVM/HVM: use SFTP (sftp -P '+v.sshPort+' root@'+v.ip+').':''}</pre><div id="ed"></div></div>`;
 if(tab==='rb')body=`<div class="card"><h3>Rebuild / Reinstall OS</h3><p class="mu">All data will be erased.</p><select id="ro"><option>ubuntu</option><option>debian</option></select><button class="d" onclick="rb('${id}')">Reinstall</button><pre id="rl" style="display:none"></pre></div>`;
 if(tab==='pw')body=`<div class="card"><h3>Change Root Password</h3><input id="np" placeholder="New password (6-40 chars)"><button onclick="cp('${id}')">Update</button><div id="pr" class="mu"></div></div>`;
 m.innerHTML=`<h2>${v.name} <span class="${v.status}" style="font-size:14px">● ${v.status}</span></h2><div style="margin-bottom:12px"><button class="s" onclick="act('${id}','start')">▶ Start</button><button class="g" onclick="act('${id}','stop')">■ Stop</button><button class="g" onclick="act('${id}','reboot')">⟳ Restart</button>${adm()?`<button class="d" onclick="del('${id}')">Delete</button>`:''}<button class="g" onclick="go('vps')">← Back</button></div><div class="tabs">${tb('ov','Overview')}${tb('fm','Files')}${tb('rb','Rebuild')}${tb('pw','Password')}</div>${body}`;}
async function act(id,a){const r=await api('POST','/vps/'+id+'/'+a);if(r.ok===false)alert(r.out||r.error);a==='delete'?go('vps'):detail(id);}
const del=id=>confirm('Delete this VPS permanently?')&&act(id,'delete');
async function fl(id){const r=await api('POST','/vps/'+id+'/files/list',{path:fp.value});fout.textContent=r.out||r.error;}
async function fo(id){const r=await api('POST','/vps/'+id+'/files/read',{path:fp.value});ed.innerHTML=`<textarea id="fc" rows="12">${esc(r.out)}</textarea><button onclick="fs('${id}')">Save file</button>`;}
async function fs(id){const r=await api('POST','/vps/'+id+'/files/write',{path:fp.value,content:fc.value});alert(r.ok?'Saved':r.out);}
async function rb(id){if(!confirm('Erase everything and reinstall?'))return;rl.style.display='block';rl.textContent='Reinstalling…';const r=await api('POST','/vps/'+id+'/reinstall',{os:ro.value});rl.textContent=r.out||'Done';}
async function cp(id){const r=await api('POST','/vps/'+id+'/password',{password:np.value});pr.textContent=r.ok?'Password updated':(r.out||r.error);}
async function createPg(){const[N,P,U]=await Promise.all([api('GET','/nodes'),api('GET','/plans'),api('GET','/users')]);
 m.innerHTML=`<h2>Create VPS</h2><div class="card"><div class="form"><div><label>Node</label><select id="cn">${N.map(n=>`<option value="${n.id}">${n.name} (${n.types.join('/')})</option>`).join('')}</select></div><div><label>Virtualization</label><select id="ct"><option value="kvm">KVM</option><option value="hvm">HVM</option><option value="lxc">LXC</option><option value="docker">Docker</option></select></div><div><label>Plan</label><select id="cl">${P.map(p=>`<option value="${p.id}">${p.name} – ${p.cpu} vCPU / ${p.ram} MB / ${p.disk} GB</option>`).join('')}</select></div><div><label>Owner (user)</label><select id="co">${U.map(x=>`<option>${x.u}</option>`).join('')}</select></div><div><label>Hostname</label><input id="cm" placeholder="web01"></div><div><label>OS template</label><select id="cs"><option>ubuntu</option><option>debian</option></select></div><div><label>Root password (blank = auto)</label><input id="cw"></div></div><button onclick="doCreate()">Create VPS</button><pre id="cg" style="display:none"></pre></div>`;}
async function doCreate(){cg.style.display='block';cg.textContent='Creating… (first KVM build downloads the OS image; may take a few minutes)';const r=await api('POST','/vps',{node:cn.value,type:ct.value,plan:cl.value,owner:co.value,name:cm.value,os:cs.value,password:cw.value});cg.textContent=r.error||r.log||('Created '+r.name);if(!r.error)setTimeout(()=>go('vps'),1500);}
async function plans(){const P=await api('GET','/plans');m.innerHTML=`<h2>Plans</h2><div class="card wrap"><table><tr><th>Name</th><th>vCPU</th><th>RAM</th><th>Disk</th><th>Bandwidth</th><th></th></tr>${P.map(p=>`<tr><td><b>${p.name}</b></td><td>${p.cpu}</td><td>${p.ram} MB</td><td>${p.disk} GB</td><td>${p.bw} GB</td><td><button class="d" onclick="dp('${p.id}')">Delete</button></td></tr>`).join('')}</table></div><div class="card"><h3>Add plan</h3><div class="form"><div><label>Name</label><input id="pn"></div><div><label>vCPU</label><input id="pc" value="1"></div><div><label>RAM (MB)</label><input id="pr" value="1024"></div><div><label>Disk (GB)</label><input id="pd" value="10"></div><div><label>Bandwidth (GB)</label><input id="pb" value="1000"></div></div><button onclick="ap()">Add plan</button></div>`;}
async function ap(){await api('POST','/plans',{name:pn.value,cpu:pc.value,ram:pr.value,disk:pd.value,bw:pb.value});plans();}
async function dp(id){await api('DELETE','/plans/'+id);plans();}
async function nodes(){const N=await api('GET','/nodes');m.innerHTML=`<h2>Nodes</h2><div class="grid">${N.map(n=>`<div class="card"><b>${n.name}</b> <span class="${n.online?'online':'offline'}">● ${n.online?'Online':'Offline'}</span><div class="mu">${n.host||''}${n.local?' (local)':''}</div><div style="margin:8px 0">${n.types.map(t=>`<span class="tag">${t.toUpperCase()}</span> `).join('')}</div><div class="mu">${esc(n.info)}</div><div>${n.vps} VPS ${n.local?'':`<button class="d" onclick="rn('${n.id}')">Remove</button>`}</div></div>`).join('')}</div><div class="card"><h3>Connect another VPS as a node</h3><p class="mu">Run <code>bash install.sh</code> → option 2 on that VPS, then paste the details here.</p><div class="form"><div><label>Name</label><input id="nn"></div><div><label>Host / IP</label><input id="nh"></div><div><label>Port</label><input id="npt" value="8443"></div><div><label>Agent token</label><input id="nt"></div><div><label>Types (comma separated)</label><input id="ny" value="docker,lxc,kvm,hvm"></div></div><button onclick="an()">Add node</button></div>`;}
async function an(){const r=await api('POST','/nodes',{name:nn.value,host:nh.value,port:npt.value,token:nt.value,types:ny.value.split(',').map(s=>s.trim())});if(r.error)alert(r.error);nodes();}
async function rn(id){if(confirm('Remove node?')){const r=await api('DELETE','/nodes/'+id);if(r.error)alert(r.error);nodes();}}
async function users(){const U=await api('GET','/users');m.innerHTML=`<h2>Users</h2><div class="card"><table><tr><th>Username</th><th>Role</th></tr>${U.map(x=>`<tr><td>${x.u}</td><td><span class="tag">${x.role}</span></td></tr>`).join('')}</table><p class="mu">Users register themselves on the login page. Assign VPS to them from Create VPS.</p></div>`;}
if(T)start();
</script></body></html>
